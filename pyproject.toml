[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    studio/migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "staticfiles",
    "studio/migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.isort]
known-first-party = ["studio", "config"]
